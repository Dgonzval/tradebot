version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: trading_bot_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-trading_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading_user} -d ${POSTGRES_DB:-trading_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_net

  redis:
    image: redis:7-alpine
    container_name: trading_bot_cache
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_net

  api:
    build: .
    container_name: trading_bot_api
    restart: always
    command: python main.py
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trading_user}:${POSTGRES_PASSWORD:-secure_password_123}@postgres:5432/${POSTGRES_DB:-trading_bot}
      REDIS_URL: redis://redis:6379
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      NEWS_API_KEY: ${NEWS_API_KEY}
      PORTFOLIO_SYMBOLS: ${PORTFOLIO_SYMBOLS:-BTC,ETH,AAPL}
      STOP_LOSS_PERCENT: ${STOP_LOSS_PERCENT:-5}
      TAKE_PROFIT_PERCENT: ${TAKE_PROFIT_PERCENT:-10}
      PRICE_CHECK_INTERVAL: ${PRICE_CHECK_INTERVAL:-5}
      NEWS_CHECK_INTERVAL: ${NEWS_CHECK_INTERVAL:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - reports_data:/app/reports
    networks:
      - trading_net

  telegram:
    build: .
    container_name: trading_bot_telegram
    restart: always
    command: python telegram_bot.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trading_user}:${POSTGRES_PASSWORD:-secure_password_123}@postgres:5432/${POSTGRES_DB:-trading_bot}
      REDIS_URL: redis://redis:6379
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      NEWS_API_KEY: ${NEWS_API_KEY}
      PORTFOLIO_SYMBOLS: ${PORTFOLIO_SYMBOLS:-BTC,ETH,AAPL}
    depends_on:
      - api
    networks:
      - trading_net

  dashboard:
    build: .
    container_name: trading_bot_dashboard
    restart: always
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trading_user}:${POSTGRES_PASSWORD:-secure_password_123}@postgres:5432/${POSTGRES_DB:-trading_bot}
      REDIS_URL: redis://redis:6379
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      NEWS_API_KEY: ${NEWS_API_KEY}
      PORTFOLIO_SYMBOLS: ${PORTFOLIO_SYMBOLS:-BTC,ETH,AAPL}
    depends_on:
      - api
    networks:
      - trading_net

volumes:
  postgres_data:
  redis_data:
  reports_data:

networks:
  trading_net:
    driver: bridge
